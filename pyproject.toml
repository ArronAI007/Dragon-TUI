[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dragon-tui"
version = "0.3.0"
description = "Dragon TUI — a terminal UI for DeepSeek API, built with Textual"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80,<1.0",
    "httpx>=0.28",
    "pydantic>=2",
    "pydantic-settings>=2",
    "tiktoken>=0.7",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
dragon-tui = "app:main"
dragon = "app:main"

[tool.setuptools]
py-modules = ["app", "config"]
packages = ["api", "mcp", "session", "tools", "ui"]
